schema_version: "1.1"
name: gate-settle-facts
description: >-
  The gate settles facts from the repository itself and asks at most once. Statuses, the list
  and the filter pattern are all in the code, so no question may ask about them. Rule:
  AGENTS.md, Decisions, "Facts are yours to find; decisions are mine to make. Never bring me a
  question you can settle by reading the code"; skills/oneshot/SKILL.md, "One stop at most" and
  "A fact is not a question". Mining patterns O1 and B1.
context:
  scaffold_script: fixture.sh
